name: Deploy Go server to Cloud Run

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'

permissions:
  contents: read
  id-token: write

env:
  REGION: asia-southeast1
  SERVICE: type-so-fast-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: ./server
          flags: --allow-unauthenticated --max-instances=1 --cpu=1 --memory=256Mi --timeout=900
          env_vars: |
            ALLOWED_ORIGINS=https://typesofast.rayhannr.dev,https://typesofast.vercel.app,http://localhost:3000,http://localhost:3123
            ACCELBYTE_BASE_URL=${{ secrets.ACCELBYTE_BASE_URL }}
            ACCELBYTE_NAMESPACE=${{ secrets.ACCELBYTE_NAMESPACE }}
            ACCELBYTE_CLIENT_ID=${{ secrets.ACCELBYTE_CLIENT_ID }}
            ACCELBYTE_ADMIN_CLIENT_ID=${{ secrets.ACCELBYTE_ADMIN_CLIENT_ID }}
            ACCELBYTE_ADMIN_CLIENT_SECRET=${{ secrets.ACCELBYTE_ADMIN_CLIENT_SECRET }}
